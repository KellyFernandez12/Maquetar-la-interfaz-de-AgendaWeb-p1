<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgendaWeb — Renta de Lavadoras</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <!-- Encabezado Oscuro -->
  <header class="navbar">
    <div class="brand">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="4"/><path d="M7 8h.01"/></svg>
      </div>
      <div class="brand-text">
        <h1>AgendaWeb</h1>
        <p>Organiza tus entregas</p>
      </div>
    </div>

    <!-- Navegación por pestañas -->
    <nav class="nav-tabs">
      <button class="tab-btn active">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Inicio
      </button>
      <button class="tab-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Mi Agenda
      </button>
    </nav>
  </header>

  <!-- Contenedor Principal -->
  <main class="app-container">
    
    <!-- Banner Informativo -->
    <section class="banner-card">
      <span class="banner-tag">AGENDAWEB</span>
      <h2>Organiza tus rentas</h2>
      <p>Registra entregas, recogidas y mantenimientos para mantener el control de tus lavadoras en un solo lugar.</p>
    </section>

    <!-- Título de Sección -->
    <div class="section-title">
      <div class="title-text">
        <h2>Nueva Renta</h2>
        <p>Completa la información del servicio.</p>
      </div>
      <button class="icon-btn" aria-label="Agregar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="10" x2="12" y2="16"/><line x1="9" y1="13" x2="15" y2="13"/></svg>
      </button>
    </div>

    <!-- Formulario -->
    <form class="event-form" onsubmit="event.preventDefault();">
      
      <!-- Campo 1 -->
      <div class="form-group">
        <label for="tipo">
          <span class="label-icon">H</span> Modelo / Tipo de Lavadora
        </label>
        <input type="text" id="tipo" placeholder="Ej. Lavadoras de 11/13kg / Lavadoras de 22kg">
      </div>

      <!-- Campo 2 -->
      <div class="form-group">
        <label for="cliente">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Nombre del cliente
        </label>
        <input type="text" id="cliente" placeholder="Ej. Alfredo olivas">
      </div>

      <!-- Campo 3 -->
      <div class="form-group">
        <label for="fecha">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Fecha de entrega
        </label>
        <input type="date" id="fecha">
      </div>

      <!-- Botón Guardar -->
      <button type="submit" class="submit-btn">Agendar servicio</button>

    </form>

  </main>

</body>
</html>
